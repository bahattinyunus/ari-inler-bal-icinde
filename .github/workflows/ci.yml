name: CI Test & Doğrulama

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Bağımlılıkları Kur
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Birim Testleri Çalıştır
      run: |
        python -m unittest discover -s tests -v

    - name: Örnekleri Doğrula
      run: |
        python examples/basic_simulation.py
        python examples/corpus_search.py
        python examples/audio_parameters.py
        python examples/custom_salik.py

    - name: CLI Komutlarını Doğrula
      run: |
        python -m ari_inler_bal_icinde simule --hizli
        python -m ari_inler_bal_icinde matris
        python -m ari_inler_bal_icinde divan -a "Pir Sultan"
        python -m ari_inler_bal_icinde zar --benlik 0.1
        python -m ari_inler_bal_icinde manifesto
